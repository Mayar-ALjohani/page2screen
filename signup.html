<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Movie and book reviews in one place">
    <meta name="keywords" content="movies, books, reviews, authors">
    <title>Page2Screen - Sign Up</title>
    <!-- css file -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- header and navbar -->
    <header>
        <h1 class="logo">Page2Screen</h1>
        <nav>
            <ul class="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <!-- page content -->
    <main class="auth-page">
        <section class="auth-card">
            <h2>Create Your Account</h2>
            <p class="auth-sub">Join Page2Screen to explore movies and the books behind them.</p>

            <form id="signupForm" onsubmit="return checkSignup()">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name">

                <label for="email">Email Address:</label>
                <input type="text" id="email" name="email" placeholder="example@email.com">

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="8 characters or more">

                <label for="confirm">Confirm Password:</label>
                <input type="password" id="confirm" name="confirm" placeholder="Write your password again">

                <!-- messages are added here by the script -->
                <div id="messages" style="margin-top: 15px;"></div>

                <button type="submit" class="auth-btn">Sign Up</button>
            </form>

            <p class="small-note">Already have an account? <a href="login.html">Login here</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Page2Screen - CPIS-358</p>
    </footer>

    <!-- js file -->
    <script src="js/script.js"></script>
</body>
</html>
